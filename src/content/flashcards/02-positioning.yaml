topic: 02-positioning
cards:
  - front: "Brand strategy"
    back: "Defines who the brand is and how the customer should perceive it."
  - front: "Brand assets"
    back: "Codify how the brand identity is expressed to the customer; they operationalize the strategy in every interaction."
  - front: "Marketing strategy"
    back: "How the brand's value is delivered into the customer's hands."
  - front: "Two ways strategy fails"
    back: "It's irrelevant, or it's not actionable."
  - front: "Brand strategy canvas: top row"
    back: "Target group · key user/market findings · key insight(s)"
  - front: "Target group: three questions"
    back: "Who is it primarily for? Sub-groups? Who is it NOT for?"
  - front: "Primary vs secondary data"
    back: "Primary: 1st-party, you collect it. Secondary: 2nd/3rd-party, collected by others."
  - front: "Quantitative vs qualitative"
    back: "Quantitative: numbers, the 'what'. Qualitative: words, the 'why'."
  - front: "Data → insight"
    back: "Data 'which means that…' insight. Insight 'as can be seen by…' data."
  - front: "Two problems with the 2×2 matrix"
    back: "We always place ourselves top-right, and it biases our thinking early."
  - front: "The four universal sliders"
    back: "Target audience (specialized ↔ universal), product scope (core ↔ all-in-one), authority source (institutional ↔ relatable), perceived value (accessible ↔ premium)."
  - front: "Category tension"
    back: "A category-specific slider drawn from research, e.g. discreet ↔ statement piece."
  - front: "Slider phrasing rule"
    back: "Phrase both ends positively to avoid good-vs-bad bias."
  - front: "White space"
    back: "An open position on the sliders that no competitor occupies: your opportunity."
  - front: "Three competitor circles"
    back: "Direct competitors · similar but weaker / differently positioned · attention-takers."
  - front: "Positioning time horizon"
    back: "Now to 1–2 years out, then redo. Five years is too speculative."
  - front: "Customer needs"
    back: "The core friction (tasks, problems) the customer tries to resolve: functional, physical or emotional."
  - front: "Customer gains"
    back: "Positive outcomes or aspirational benefits the customer hopes for beyond solving the problem."
  - front: "Jobs To Be Done (JTBD)"
    back: "Clayton Christensen's framework: customers 'hire' a product to do a job (e.g. a milkshake for a morning commute break)."
  - front: "Positioning pyramid, bottom → top"
    back: "Key product properties → customer needs & gains → brand topics → brand territory."
  - front: "Brand territory"
    back: "The conceptual space you occupy in customers' minds; 2–3 words. Fails if a competitor's name fits."
  - front: "Brand topics"
    back: "3–4 repeatable communication pillars with enough content depth."
  - front: "Key product properties"
    back: "Features, specs and capabilities that deliver on the customer's needs and gains."
  - front: "Value proposition template"
    back: "While [competitors] offer [category] for [their audience], [our audience] who [problem] choose [brand] as their [category] so they can [benefit]."
  - front: "Fitbit Air brand territory"
    back: "The distraction-free health companion."
  - front: "Red teaming"
    back: "Deliberately critiquing a partner's strategy: generic? aligned? separates from competitors? problem vs solution contrast?"
  - front: "Four brand asset groups"
    back: "Visual identity · verbal identity · commercial collateral · governance."
