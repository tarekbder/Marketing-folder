topic: 05-customer-journey
cards:
  - front: "Customer journey"
    back: "A highly predictable, repeatable process taking prospects through touchpoints to maximise revenue while minimising friction."
  - front: "Two ideal journey outcomes"
    back: "Contact details and/or revenue."
  - front: "Messy middle"
    back: "Google's term for customers looping between exploration and evaluation before buying."
  - front: "Closing the gap (3 principles)"
    back: "Ensure brand presence · employ behavioural science · close the gap between trigger and purchase."
  - front: "Portfolio of journeys"
    back: "Acquisition, channel-specific, retention & lifecycle, and expansion journeys."
  - front: "Product journey vs marketing journey"
    back: "Product: feelings and pain points while using the product. Marketing/sales: the touchpoint sequence from awareness to conversion."
  - front: "Journey design: 3 steps"
    back: "GTM motion → ICP & persona → the journey."
  - front: "GTM motion"
    back: "The overarching strategy within which the customer journey is created."
  - front: "E-commerce motion"
    back: "'See it, want it, buy it' · self-serve storefront · minutes to days (Gymshark, Allbirds)."
  - front: "PLG motion"
    back: "'Try before you buy' · freemium / free trial · days to weeks (Figma, Canva, Lovable)."
  - front: "Marketing-led motion"
    back: "'Learn/follow, decide' · inbound + gate + sales · weeks to months (HubSpot, HiBob)."
  - front: "Sales-led motion"
    back: "'Find & get them' · outbound + proposal · months, top-down buyer (Workday, Salesforce Enterprise)."
  - front: "ICP"
    back: "Ideal customer profile: an entity/account. Core to B2B; used for filtering, qualification, targeting."
  - front: "Persona"
    back: "A human buyer profile for B2B and B2C; builds empathy and informs content."
  - front: "B2B buying centre"
    back: "Champion · buyer (budget holder) · end user · gatekeeper."
  - front: "Most overlooked persona elements"
    back: "The quote, information consumption, and purchase habits."
  - front: "Persona quote test"
    back: "Would someone actually say this to a friend?"
  - front: "Discovery stage"
    back: "Traffic source: ads, blog, influencers, partners, SEO/GEO. Build a portfolio; organic takes 6+ months."
  - front: "Destination stage"
    back: "Engagement: LP, product page, homepage, info page. Make sure you keep the contact details."
  - front: "Gate stage"
    back: "Optional micro-value: discount, free course, quiz, webinar, whitepaper, PLG sign-up, micro-transaction."
  - front: "Nurture stage"
    back: "Education: email, push, remarketing, community, events. Not strictly sequential."
  - front: "Conversion stage"
    back: "Macro-value: the transaction (purchase, contract, booked consultation)."
  - front: "Onboarding, upsell, promote"
    back: "Post-purchase & activation → expansion (offers, loyalty, cross-sell) → referral (reviews, referral programme, ambassadors)."
  - front: "Journey design considerations"
    back: "Map human systems · map tech systems · map & monitor handovers · track & analyse (fix the biggest drop-off first)."
  - front: "Organic social in the journey"
    back: "Rarely converts on its own; often works better as a nurture channel than as primary acquisition."
