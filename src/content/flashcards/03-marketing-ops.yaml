topic: 03-marketing-ops
cards:
  - front: "The martech trap in numbers"
    back: "15,505 vendors on the market · 18–40 tools used per organisation · only 33% of capabilities used."
  - front: "Six stack layers (backend → customer)"
    back: "Data management → tracking & analytics → productivity & orchestration → production & enablement → experience & transaction → distribution & acquisition."
  - front: "Data management layer"
    back: "Data warehouse, purchase logs, CRM/CDP: captures and organises raw customer data."
  - front: "Tracking & analytics layer"
    back: "Google Analytics, BI dashboards, GTM & pixels: collects and visualises performance data."
  - front: "Productivity & orchestration layer"
    back: "Project management (Asana, Jira) and no-code automation (Make, Zapier)."
  - front: "Production & enablement layer"
    back: "Creative production, copywriting, CMS, sales materials."
  - front: "Experience & transaction layer"
    back: "Shopfront, landing pages, lead forms, A/B testing."
  - front: "Distribution & acquisition layer"
    back: "Ad platforms, social, search, email."
  - front: "Google Tag Manager (GTM)"
    back: "A container code on the site that lets marketers add tracking pixels without a developer each time."
  - front: "Product feed"
    back: "A structured file of product metadata (price, images, attributes) that powers dynamic ads on Google, Meta and others."
  - front: "Stack considerations"
    back: "Fit to stage · naming conventions · minimum required process · fit-for-purpose AI · plan short and long term · decentralise when possible."
  - front: "Stack risks"
    back: "Resource drain · attention drain · slower site · data noise (no single source of truth) · slow execution · bad decisions."
  - front: "The attribution problem"
    back: "Ad platforms each claim credit for the same conversions, so their totals can exceed actual revenue. Build your own source of truth."
  - front: "Deterministic & predefined workflow"
    back: "Plain automation, no AI. E.g. Slack message when a new lead signs up."
  - front: "Mostly deterministic workflow"
    back: "Automation + AI enrichment. E.g. enrich and score new leads with AI."
  - front: "Probabilistic & agentic workflow"
    back: "AI decides if/when/how to act. E.g. an agent spots company changes, adjusts account priority and alerts the team."
  - front: "Human-in-the-loop spectrum"
    back: "Fully human → human produced, AI enhanced → co-produced → human triggered, AI produced → autonomous AI."
  - front: "Where to put the human"
    back: "Before customer-facing actions: approve content, campaign variations and templates."
  - front: "Three goals for AI in marketing"
    back: "Reduce effort · increase value · unlock new capabilities. Don't over-engineer too soon."
  - front: "Stack maturity: validation stage"
    back: "Under €500k revenue, ~5–10 tools: lightweight LP, basic CRM, GTM + GA4, website/shop, 1–2 socials."
  - front: "Waste zone"
    back: "High effort, low value → kill or negotiate. Ask: is it a duplicate?"
  - front: "Core zone"
    back: "High effort, high value → automate. Ask: can it be automated?"
  - front: "Question zone"
    back: "Low effort, low value → prune or consolidate. Ask: is it used?"
  - front: "Target zone"
    back: "Low effort, high value → protect and scale."
  - front: "GDPR basics"
    back: "Active consent (checkbox, DOI, cookies, unsubscribe) · right to be forgotten · avoid manual access to customer data. Fines up to €20M or 4% of revenue."
