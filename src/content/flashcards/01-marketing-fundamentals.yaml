topic: 01-marketing-fundamentals
cards:
  - front: "Marketing (course definition)"
    back: "The systematic bridge that puts great products in the hands of people who benefit from them, not making products look shiny."
  - front: "Biggest startup risk"
    back: "Not learning fast enough."
  - front: "Marketing's bottom line"
    back: "Get as many customers as possible, as cheaply as possible, and retain them as long as you can."
  - front: "Seven 'easily…' qualities"
    back: "Discoverable · accessible · functional · enjoyable · likable · valuable · trustworthy"
  - front: "Price"
    back: "How much? Model and strategy, amount, length, discounts, terms."
  - front: "Product"
    back: "What? Features, design, quality, the problem it solves."
  - front: "Place"
    back: "Where? Online vs offline, DTC vs marketplace, logistics."
  - front: "Promotion"
    back: "How do customers arrive? Messaging, channels, campaigns."
  - front: "People (the +P)"
    back: "Who? Both customers and team. For solo founders: in-house vs outsourced."
  - front: "Three uses of the 4Ps + P"
    back: "Flesh out an idea early · align co-founders, investors or team · plan a detailed strategy."
  - front: "Decision-maker vs payer"
    back: "Map who triggers the decision and who pays; they can differ (parents pay, the child is a sub-customer). In B2B, map decision maker and contact separately."
  - front: "DTC vs marketplace"
    back: "DTC is cheapest but you must drive traffic. Marketplaces take ~15–30% and suit some price points, not luxury."
  - front: "Time to value"
    back: "When the customer accesses the core value: now (at payment) or later (free teaser value first)."
  - front: "Value now (purchase-based)"
    back: "Core value at payment. Minutes to days, self-service. E-commerce, DTC, low-friction SaaS."
  - front: "Value later (lead-based)"
    back: "Teaser value free first, full value at payment. Days to months, high-touch. Enterprise B2B, high-ticket services, complex products, apps."
  - front: "Marketing's job: purchase flow"
    back: "Deliver mostly intent-ful prospects and reduce cognitive friction."
  - front: "Marketing's job: lead flow"
    back: "Deliver qualified leads and nurture them to readiness."
  - front: "Purchase KPIs"
    back: "Add-to-cart rate, checkout completion rate, AOV, ROAS / CAC / payback, marketing efficiency."
  - front: "Lead KPIs"
    back: "CPL, lead-to-opportunity rate, lead-to-sale time, ROAS / CAC, cost per qualified lead."
  - front: "AARRR"
    back: "Pirate metrics: acquisition, activation, revenue, retention, referral."
  - front: "TOFU / MOFU / BOFU"
    back: "Top, middle and bottom of the funnel: awareness → consideration → direct response."
  - front: "Problem 1 with linear funnels"
    back: "People are complex, not linear. Serve four needs continuously: discover the solution, experience the brand, gain knowledge, solve the challenge."
  - front: "Problem 2: the leaking bucket"
    back: "Money in to get money out: when paid acquisition stops, revenue stops."
  - front: "Growth loop"
    back: "A self-reinforcing, mostly automated system that attracts new customers with minimal investment."
  - front: "Five growth loop types"
    back: "Utility (Zoom) · content (Pinterest) · referral (N26) · marketplace (Airbnb) · social status (Strava)."
