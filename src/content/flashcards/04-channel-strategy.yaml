topic: 04-channel-strategy
cards:
  - front: "What channel choice depends on"
    back: "Business model · target audience · customer journey · industry · positioning · ticket price · business goals · budget."
  - front: "'The answer is not always a channel'"
    back: "Founder outreach, lead lists, events, partnerships or sales help can beat marketing channels early on."
  - front: "Paid search"
    back: "Captures active intent; goal is conversion; very quick first signal (days)."
  - front: "Paid social"
    back: "Builds reach and discovery with passive intent; quick signal, but run 2+ weeks for the algorithm to learn."
  - front: "SEO"
    back: "Reach and authority; compounds over time; weeks to months to first signal; low direct cost."
  - front: "Influencers & UGC"
    back: "Reach, conversion and authority through third-party validation."
  - front: "Influencer payment models"
    back: "Fixed fee · CPM · revenue share / commission (voucher codes) · barter (free product, gifts)."
  - front: "Email & lifecycle"
    back: "Engagement and conversion of people already reached; nurtures rather than acquires."
  - front: "PR"
    back: "Authority, reach and positioning; earned, not paid, but needs weeks of outreach and an agency, freelancer or founder time."
  - front: "Test budget rule of thumb"
    back: "About 2–3× the ticket price (≈ €200 for a €50 product)."
  - front: "Concentrate vs spread"
    back: "Concentrate early: thin budgets stop algorithms learning, add overhead and dilute impact."
  - front: "Conversion goal at zero sales"
    back: "Optimise for earlier actions (clicks, LP views, micro-conversions), then move towards purchases as volume grows."
  - front: "Instagram"
    back: "Lifestyle & entertainment · medium production · visual storefront; great for practical lifestyle utility."
  - front: "TikTok"
    back: "Entertainment & search · low–medium production · fast-lived, high frequency; discovery, impulse, native shop."
  - front: "YouTube"
    back: "Knowledge & search · medium–high production · compounding, high trust for higher tickets."
  - front: "LinkedIn"
    back: "Network & knowledge · employee content over company pages · searchable ICP directory · B2B."
  - front: "Pinterest"
    back: "Inspiration & search · long-ish lifespan, native click-through · high intent for home, life events, fashion."
  - front: "Facebook"
    back: "Community & utility · organic reach harder · private groups thrive."
  - front: "Brand entity"
    back: "The connected picture search and AI build from citations, reviews, mentions, links, structured data, topical content and profiles."
  - front: "Omni-presence elements"
    back: "Amount and variety of touchpoints · single vs multi-channel · frequency & recency · coherent, complete messaging."
  - front: "Content engine"
    back: "A systematic, repeatable operation to ideate, produce, distribute and measure content at scale: planning → production → distribution → analysis."
  - front: "Anchor asset"
    back: "One hero content piece (whitepaper, video, mini-course, podcast…) repurposed for key channels, optionally used as a gate."
  - front: "Pillar–cluster"
    back: "One broad pillar article plus shorter subtopic articles that link back to it (SEO)."
  - front: "Myth: bespoke content per channel"
    back: "Ideally yes; realistically, build around one anchor and repurpose."
  - front: "Myth: AI = 24/7 content engine"
    back: "Yes, but everyone sounds the same, you need a human in the loop, and quality isn't consistently on par with humans yet."
