topic: 06-roi-decision-making
cards:
  - front: "Metrics vs KPIs vs goals"
    back: "Metrics: raw, neutral numbers. KPIs: selected metrics that signal health. Goals: time-bound targets set by strategic priorities."
  - front: "Primary vs secondary data"
    back: "Collected by you (1st party, e.g. AOV) / collected by others (2nd/3rd party, e.g. Statista)."
  - front: "Vanity vs impact metrics"
    back: "Don't correlate with impact (impressions, page views) / move the business forward (deals won, qualified leads)."
  - front: "Quantitative vs qualitative"
    back: "Numbers, the what (leads, CVR) / words, the why (open-text survey answers)."
  - front: "Leading vs lagging indicators"
    back: "Predict future outcomes (pipeline, activations, add-to-carts) / the final result (sales, revenue, churn)."
  - front: "North Star metric"
    back: "A leading indicator marking the moment customer value is realised; predicts revenue."
  - front: "Correlation ≠ causation"
    back: "The sweeteners study: participants were obese, so obesity may cause the decline. Always ask the follow-up question."
  - front: "UTM structure"
    back: "Base URL + ? + key=value pairs joined by &. Keys: source, medium, campaign, term, content."
  - front: "utm_source vs utm_medium"
    back: "Source = where traffic comes from (google, meta). Medium = type of traffic (cpc, organic, referral)."
  - front: "Static vs dynamic UTM values"
    back: "Typed by hand (meta) / placeholders the platform fills in ({{ad.id}})."
  - front: "Aggregate vs cohort report"
    back: "A snapshot of a timeframe / one group of customers followed over time."
  - front: "P&L vs cash flow"
    back: "When money is incurred (performance) / when money moves (liquidity, runway)."
  - front: "P&L lines (top to bottom)"
    back: "Revenue → COGS → customer acquisition → OPEX → EBITDA."
  - front: "COGS"
    back: "Cost of goods sold: production, quality, cost of sales (payment fees, delivery)."
  - front: "EBITDA"
    back: "Earnings before interest, tax, depreciation and amortisation: operating profit."
  - front: "Marketing efficiency"
    back: "UA spend ÷ net revenue. Lower is better."
  - front: "ROAS"
    back: "Net revenue ÷ UA spend. Higher is better."
  - front: "Efficiency benchmarks: DTC e-com"
    back: "Seed 30% · growth 25% · mature under 15% (±5%, UA spend only; add 5–10 pp for people and tools)."
  - front: "Efficiency benchmarks: B2B SaaS / DTC"
    back: "Seed 25% · growth 15% · mature under 10% (±5%, UA spend only)."
  - front: "Self-attribution"
    back: "Each ad platform claims the conversion for itself; 5–15% double attribution is typical."
  - front: "Five attribution models"
    back: "Last touch · first touch · multi-touch (even or weighted) · incremental / lift · media mix model (MMM)."
  - front: "Attribution challenges"
    back: "Match rates · assumes connected data · descriptive not predictive · misses earned media · affected by business terms · trees instead of forest."
  - front: "Attribution recommendations"
    back: "Keep it simple · minimise unassigned data · be consistent · fit for purpose · track 2+ models · look at overall efficiency and the P&L."
  - front: "Why we optimise"
    back: "Growth (scale what works) and efficiency (cut or redirect waste)."
  - front: "Six optimisation lever groups"
    back: "Creative & messaging · distribution & campaigns · data infrastructure · conversion & UX · offer · sales ops."
